[project]
name = "ict-hanxin"
version = "0.1.0"
description = "ICT/SMC concept library and PO3 backtesting framework for NQ futures"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ict", "strategies", "backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

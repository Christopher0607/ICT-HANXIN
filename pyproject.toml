[project]
name = "ict-hanxin"
version = "0.1.0"
description = "ICT/SMC concept library and PO3 backtesting framework for NQ futures"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only scripts/fetch_databento.py needs this. Running the backtests off the
# stored parquet files does not, so it stays out of the main dependency list.
data = ["databento>=0.34"]
# Only scripts/report_pdf.py needs this, and it needs a Chromium build too
# (uv run playwright install chromium). The report itself is a plain HTML file;
# nothing in the main path should have to carry a browser.
pdf = ["playwright>=1.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ict", "strategies", "backtest", "bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
